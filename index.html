<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Charl's Bistro — Upcoming Events</title>
    <meta name="title" content="Charls Bistro — Upcoming Events">
    <meta name="description" content="Charls Bistro — discover upcoming live music, DJs and events.">
    <meta name="author" content="Charls Bistro">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.charlsbistro.com/">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.charlsbistro.com/">
    <meta property="og:title" content="Charls Bistro — Upcoming Events">
    <meta property="og:description" content="Charls Bistro — discover upcoming live music, DJs and events.">
    <meta property="og:image" content="images/events/event-01.jpg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.charlsbistro.com/">
    <meta property="twitter:title" content="Charls Bistro — Upcoming Events">
    <meta property="twitter:description" content="Charls Bistro — discover upcoming live music, DJs and events.">
    <meta property="twitter:image" content="images/events/event-01.jpg">
    
    <!-- Favicon -->
    <link rel="icon" href="images/logo/logo.png" type="image/png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen — Logo Only -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="loading-logo">
                <img src="images/logo/logo.png" alt="Charls Bistro Logo" class="loading-logo-image">
            </div>
        </div>
    </div>
    
    <!-- Background Image -->
    <div class="page-background" aria-hidden="true">
        <img src="images/background/background.jpg" alt="" class="page-background-image">
        <div class="page-background-overlay"></div>
    </div>
    
    <!-- Header -->
    <header class="header" id="header">
        <div class="container header-inner">
            <!-- Logo Only Navbar -->
            <a href="index.html" class="logo" aria-label="Charls Bistro Home">
                <img src="images/logo/logo.png" alt="Charl's Bistro" class="logo-image">
            </a>
            
            <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false">
                <span class="burger-line"></span>
                <span class="burger-line"></span>
            </button>
        </div>
    </header>
    
    <!-- Burger Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
        <div class="menu-content">
            <div class="menu-header">
                <img src="images/logo/logo.png" alt="Charls Bistro" class="menu-logo-image">
                <button class="menu-close" id="menuClose" aria-label="Close menu">×</button>
            </div>
            
            <nav class="menu-nav" aria-label="Main navigation">
                <ul>
                    <li style="--delay: 0.1s"><a href="index.html" class="menu-link">Events</a></li>
                    <li style="--delay: 0.2s"><a href="about.html" class="menu-link">About</a></li>
                    <li style="--delay: 0.3s"><a href="reservation.html" class="menu-link">Reservation</a></li>
                    <li style="--delay: 0.4s"><a href="about.html#contact" class="menu-link">Contact</a></li>
                </ul>
            </nav>
            
            <div class="menu-footer" style="--delay: 0.5s">
                <a href="https://www.instagram.com/charlsbistro/" target="_blank" rel="noopener noreferrer" class="menu-instagram">@charlsbistro</a>
            </div>
        </div>
    </div>
    
    <!-- Main Content -->
    <main>
        <!-- Upcoming Events Section -->
        <section class="events-section">
            <div class="container">
                <div class="events-heading">
                    <span class="events-label">This week</span>
                    <h1 class="events-title">Events</h1>
                </div>
                
                <!-- Horizontal Card Carousel -->
                <div class="carousel-wrapper">
                    <div id="eventsCarousel" class="events-carousel">
                        <!-- Cards rendered by JavaScript -->
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-inner">
            <img src="images/logo/logo.png" alt="Charls Bistro" class="footer-logo-image">
            <div class="footer-links">
                <a href="https://www.instagram.com/charlsbistro/" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="about.html#contact">Contact</a>
            </div>
            <span class="footer-copy">© 2026 Charl's Bistro</span>
        </div>
    </footer>
    
    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Gallery — Charl's Bistro</title>
    <meta name="description" content="Moments from Charl's Bistro — live music, parties and unforgettable nights.">
    <link rel="icon" href="images/logo/logo.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #080808;
            color: #f5f5f5;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }
        img { max-width: 100%; height: auto; display: block; }
        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
        ul, ol { list-style: none; }

        :root {
            --bg: #080808;
            --bg-light: #0e0e0e;
            --surface: #111111;
            --surface-light: #181818;
            --text: #f5f5f5;
            --text-muted: #8a8a8a;
            --text-faint: #555555;
            --accent: #c7a76c;
            --accent-light: #d4b887;
            --border: rgba(255, 255, 255, 0.1);
            --border-light: rgba(255, 255, 255, 0.2);
            --font-display: 'DM Serif Display', Georgia, 'Times New Roman', serif;
            --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --container-max: 1400px;
            --container-padding: clamp(1.5rem, 5vw, 4rem);
            --header-height: 80px;
            --header-height-mobile: 70px;
            --transition-fast: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-medium: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --z-content: 10;
            --z-header: 100;
            --z-menu: 200;
            --z-lightbox: 500;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: 0.01em;
        }
        .container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0 var(--container-padding);
            width: 100%;
            position: relative;
            z-index: var(--z-content);
        }

        /* HEADER */
        .header {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: var(--z-header);
            transition: background var(--transition-medium), border-color var(--transition-medium);
            border-bottom: 1px solid transparent;
        }
        .header.scrolled {
            background: rgba(8, 8, 8, 0.95);
            border-bottom-color: var(--border);
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
            height: var(--header-height);
            transition: height var(--transition-medium);
        }
        .header.scrolled .header-inner { height: var(--header-height-mobile); }
        .logo {
            display: flex; align-items: center; line-height: 1;
            z-index: calc(var(--z-menu) + 10);
        }
        .logo-image {
            width: auto; height: 50px; object-fit: contain;
            transition: height var(--transition-medium);
        }
        .header.scrolled .logo-image { height: 40px; }

        .burger {
            display: flex; flex-direction: column; gap: 0.4rem;
            padding: 0.75rem;
            z-index: calc(var(--z-menu) + 10);
            position: relative;
            align-items: flex-end;
        }
        .burger-line {
            width: 1.8rem; height: 1.5px;
            background: var(--text);
            transition: all var(--transition-fast);
            display: block;
        }
        .burger-line:last-child { width: 1.4rem; }
        .burger:hover .burger-line { background: var(--accent); }
        .burger.active .burger-line:first-child {
            transform: rotate(45deg) translate(3px, 3px);
            width: 1.8rem;
        }
        .burger.active .burger-line:last-child {
            transform: rotate(-45deg) translate(3px, -3px);
            width: 1.8rem;
        }

        /* MENU */
        .menu-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            z-index: var(--z-menu);
            opacity: 0; visibility: hidden;
            transition: opacity var(--transition-medium), visibility var(--transition-medium);
        }
        .menu-overlay.open { opacity: 1; visibility: visible; }
        .menu-content {
            display: flex; flex-direction: column; justify-content: space-between;
            height: 100%;
            padding: 2rem var(--container-padding);
            max-width: var(--container-max);
            margin: 0 auto;
            width: 100%;
        }
        .menu-header {
            display: flex; align-items: center; justify-content: space-between;
            position: relative;
        }
        .menu-logo-image { width: auto; height: 45px; object-fit: contain; }
        .menu-close {
            font-size: 2.5rem; font-weight: 300; color: var(--text);
            line-height: 1;
            transition: color var(--transition-fast);
            padding: 0.5rem;
        }
        .menu-close:hover { color: var(--accent); }
        .menu-nav ul { display: flex; flex-direction: column; gap: 1.5rem; }
        .menu-link {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 400;
            color: var(--text);
            letter-spacing: 0.02em;
            transition: color var(--transition-fast), padding-left var(--transition-fast);
            display: inline-block;
            opacity: 0; transform: translateY(20px);
            animation: menuLinkIn 0.6s ease forwards;
            animation-delay: var(--delay);
        }
        .menu-link:hover { color: var(--accent); padding-left: 1.5rem; }
        @keyframes menuLinkIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .menu-footer {
            opacity: 0;
            animation: menuLinkIn 0.6s ease forwards;
            animation-delay: var(--delay);
        }
        .menu-instagram {
            font-size: 0.9rem; letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--text-muted);
            transition: color var(--transition-fast);
        }
        .menu-instagram:hover { color: var(--accent); }

        /* GALLERY PAGE */
        .gallery-page main {
            padding-top: calc(var(--header-height) + 5rem);
            padding-bottom: 4rem;
            min-height: 100vh;
        }
        .gallery-heading {
            margin-bottom: 2rem;
            display: flex; flex-direction: column; gap: 0.5rem;
        }
        .gallery-label {
            font-size: 0.7rem; font-weight: 500;
            letter-spacing: 0.35em; text-transform: uppercase;
            color: var(--accent);
        }
        .gallery-title {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 400;
            letter-spacing: 0.03em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .gallery-filters {
            display: flex; gap: 0.75rem; margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .gallery-filter {
            padding: 0.6rem 1.4rem;
            font-size: 0.7rem; font-weight: 500;
            letter-spacing: 0.2em; text-transform: uppercase;
            background: transparent; color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 100px;
            transition: all 0.3s ease;
        }
        .gallery-filter:hover { color: var(--text); border-color: var(--border-light); }
        .gallery-filter.active {
            color: var(--bg); background: var(--accent); border-color: var(--accent);
        }

        /* MASONRY */
        .gallery-masonry {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 8px;
            gap: 12px;
            grid-auto-flow: row;
        }
        .gallery-item {
            grid-row-end: span 30;
            overflow: hidden;
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            background: var(--surface);
            -webkit-tap-highlight-color: transparent;
        }
        .gallery-item img {
            width: 100%; height: auto; display: block;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gallery-item:hover img { transform: scale(1.05); }

        .gallery-item-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(8, 8, 8, 0) 0%,
                rgba(8, 8, 8, 0) 60%,
                rgba(8, 8, 8, 0.65) 100%
            );
            opacity: 0;
            display: flex; align-items: flex-end; justify-content: flex-end;
            padding: 1rem;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .gallery-item:hover .gallery-item-overlay { opacity: 1; }

        /* Video card — play icon në qendër */
        .gallery-item-video { position: relative; }
        .gallery-video-poster { width: 100%; height: auto; display: block; }
        .gallery-item-video .gallery-item-overlay {
            background: rgba(8, 8, 8, 0.25);
            opacity: 1;
            align-items: center; justify-content: center;
            padding: 0;
        }
        .gallery-video-play-icon {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            padding-left: 4px; /* centron trekëndëshin optikisht */
        }
        .gallery-item-video:hover .gallery-video-play-icon {
            transform: scale(1.12);
        }

        /* LIGHTBOX — minimalist, kliko kudo për të mbyllur */
        .gallery-lightbox {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.96);
            z-index: var(--z-lightbox);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
            padding: 1rem;
            cursor: zoom-out;
        }
        .gallery-lightbox.open { opacity: 1; visibility: visible; }

        .lightbox-content {
            max-width: 95vw; max-height: 95vh;
            display: flex; align-items: center; justify-content: center;
            animation: lightboxIn 0.35s ease;
            cursor: default;
        }
        @keyframes lightboxIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .lightbox-media {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            display: block;
        }

        /* FOOTER */
        .footer {
            border-top: 1px solid var(--border);
            margin-top: 50px;
            padding: 20px;
            background: rgba(8, 8, 8, 0.8);
            position: relative;
            z-index: var(--z-content);
        }
        .footer-inner {
            display: flex; flex-direction: column; align-items: center;
            gap: 1rem; text-align: center;
        }
        .footer-logo-image {
            width: auto; height: 40px; object-fit: contain; opacity: 0.8;
        }
        .footer-links { display: flex; gap: 2rem; }
        .footer-links a {
            font-size: 0.7rem; font-weight: 500;
            letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--text-muted);
            transition: color var(--transition-fast);
        }
        .footer-links a:hover { color: var(--accent); }
        .footer-copy {
            font-size: 0.65rem; letter-spacing: 0.15em;
            color: var(--text-faint);
        }

        /* RESPONSIVE */
        @media (min-width: 1200px) {
            .gallery-masonry { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 1024px) {
            .gallery-masonry { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            :root {
                --header-height: 70px;
                --header-height-mobile: 65px;
            }
            .gallery-page main { padding-top: calc(var(--header-height) + 4rem); }
            .gallery-masonry {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                grid-auto-rows: 6px;
            }
            .logo-image { height: 40px; }
            .header.scrolled .logo-image { height: 35px; }
            .menu-link { font-size: 2.2rem; }
        }
        @media (max-width: 480px) {
            :root { --container-padding: 1.25rem; }
            .gallery-page main { padding-top: calc(var(--header-height) + 3rem); }
            .gallery-filters { gap: 0.5rem; }
            .gallery-filter { padding: 0.5rem 1rem; font-size: 0.65rem; }
            .gallery-video-play-icon { width: 46px; height: 46px; font-size: 1.2rem; }
            .logo-image { height: 45px; }
            .header.scrolled .logo-image { height: 30px; }
            .footer-links { gap: 1.25rem; }
            .footer-links a { font-size: 0.6rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .gallery-item img { transition: none; }
        }
    </style>
</head>
<body class="gallery-page">
    <header class="header" id="header">
        <div class="container header-inner">
            <a href="index.html" class="logo" aria-label="Charl's Bistro Home">
                <img src="images/logo/logo.png" alt="Charl's Bistro" class="logo-image">
            </a>
            <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false">
                <span class="burger-line"></span>
                <span class="burger-line"></span>
            </button>
        </div>
    </header>

    <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
        <div class="menu-content">
            <div class="menu-header">
                <img src="images/logo/logo.png" alt="Charls Bistro" class="menu-logo-image">
                <button class="menu-close" id="menuClose" aria-label="Close menu">×</button>
            </div>
            <nav class="menu-nav" aria-label="Main navigation">
                <ul>
                    <li style="--delay: 0.1s"><a href="index.html" class="menu-link">Events</a></li>
                    <li style="--delay: 0.2s"><a href="gallery.html" class="menu-link">Gallery</a></li>
                    <li style="--delay: 0.3s"><a href="about.html" class="menu-link">About</a></li>
                    <li style="--delay: 0.4s"><a href="reservation.html" class="menu-link">Reservation</a></li>
                    <li style="--delay: 0.5s"><a href="about.html#contact" class="menu-link">Contact</a></li>
                </ul>
            </nav>
            <div class="menu-footer" style="--delay: 0.6s">
                <a href="https://www.instagram.com/charlsbistro/" target="_blank" rel="noopener noreferrer" class="menu-instagram">@charlsbistro</a>
            </div>
        </div>
    </div>

    <main>
        <section class="gallery-section">
            <div class="container">
                <div class="gallery-heading">
                    <span class="gallery-label">Moments</span>
                    <h1 class="gallery-title">Gallery</h1>
                </div>

                <div class="gallery-masonry" id="galleryGrid"></div>
            </div>
        </section>
    </main>

    <!-- Lightbox — kliko kudo për të mbyllur -->
    <div class="gallery-lightbox" id="galleryLightbox" aria-hidden="true">
        <div class="lightbox-content" id="lightboxContent"></div>
    </div>

    <footer class="footer">
        <div class="container footer-inner">
            <img src="images/logo/logo.png" alt="Charls Bistro" class="footer-logo-image">
            <div class="footer-links">
                <a href="https://www.instagram.com/charlsbistro/" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="gallery.html">Gallery</a>
                <a href="about.html#contact">Contact</a>
            </div>
            <span class="footer-copy">© 2026 Charl's Bistro</span>
        </div>
    </footer>

    <script>
        /* HEADER SCROLL */
        const header = document.getElementById('header');
        window.addEventListener('scroll', () => {
            const top = window.pageYOffset || document.documentElement.scrollTop;
            header.classList.toggle('scrolled', top > 30);
        }, { passive: true });

        /* BURGER MENU */
        const burger = document.getElementById('burger');
        const menuOverlay = document.getElementById('menuOverlay');
        const menuClose = document.getElementById('menuClose');

        function openMenu() {
            menuOverlay.classList.add('open');
            burger.classList.add('active');
            burger.setAttribute('aria-expanded', 'true');
            menuOverlay.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }
        function closeMenu() {
            menuOverlay.classList.remove('open');
            burger.classList.remove('active');
            burger.setAttribute('aria-expanded', 'false');
            menuOverlay.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }
        if (burger) {
            burger.addEventListener('click', () => {
                menuOverlay.classList.contains('open') ? closeMenu() : openMenu();
            });
        }
        if (menuClose) menuClose.addEventListener('click', closeMenu);
        menuOverlay.querySelectorAll('.menu-link').forEach(link => {
            link.addEventListener('click', closeMenu);
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menuOverlay.classList.contains('open')) closeMenu();
        });

        /* GALLERY DATA */
        const galleryItems = [
            { type: 'image', src: 'images/gallery/1.jpeg', alt: 'Live music night' },
            { type: 'image', src: 'images/gallery/2.jpeg', alt: 'Crowd cheering' },
            { type: 'image', src: 'images/gallery/4.jpeg', alt: 'DJ set' },
            { type: 'image', src: 'images/gallery/5.jpeg', alt: 'Cocktails' }
        ];

        const galleryGrid = document.getElementById('galleryGrid');
        const lightbox = document.getElementById('galleryLightbox');
        const lightboxContent = document.getElementById('lightboxContent');

        /* RENDER */
        function renderGallery(filter = 'all') {
            if (!galleryGrid) return;

            const items = filter === 'all'
                ? galleryItems
                : galleryItems.filter(item => item.type === filter);

            if (items.length === 0) {
                galleryGrid.innerHTML = `
                    <div style="padding: 4rem 2rem; text-align: center; width: 100%; grid-column: 1 / -1;">
                        <p style="font-family: var(--font-display); font-size: 1.5rem; color: var(--text-muted);">
                            No media yet.
                        </p>
                    </div>`;
                return;
            }

            galleryGrid.innerHTML = items.map((item) => {
                if (item.type === 'image') {
                    return `
                        <div class="gallery-item gallery-item-image"
                             data-type="image"
                             data-src="${item.src}"
                             data-alt="${item.alt}">
                            <img src="${item.src}" alt="${item.alt}" loading="lazy" decoding="async">
                        </div>`;
                }
                return `
                    <div class="gallery-item gallery-item-video"
                         data-type="video"
                         data-src="${item.src}"
                         data-alt="${item.alt}">
                        <img src="${item.poster}" alt="${item.alt}" loading="lazy" decoding="async" class="gallery-video-poster">
                        <div class="gallery-item-overlay">
                            <span class="gallery-video-play-icon">▶</span>
                        </div>
                    </div>`;
            }).join('');

            initMasonry();
        }

        /* MASONRY */
        function initMasonry() {
            if (!galleryGrid) return;

            const items = Array.from(galleryGrid.querySelectorAll('.gallery-item'));
            const GAP = window.innerWidth <= 768 ? 8 : 12;
            const ROW_HEIGHT = window.innerWidth <= 768 ? 6 : 8;

            const applySpan = (item) => {
                const img = item.querySelector('img');
                if (!img || !img.naturalWidth) return;
                const width = item.getBoundingClientRect().width;
                if (width === 0) return;
                const height = width * (img.naturalHeight / img.naturalWidth);
                const span = Math.ceil((height + GAP) / (ROW_HEIGHT + GAP));
                item.style.gridRowEnd = `span ${span}`;
            };

            items.forEach(item => {
                const img = item.querySelector('img');
                if (!img) return;
                if (img.complete && img.naturalWidth > 0) {
                    applySpan(item);
                } else {
                    img.addEventListener('load', () => applySpan(item), { once: true });
                }
            });

            if (window.__galleryResizeHandler) {
                window.removeEventListener('resize', window.__galleryResizeHandler);
            }
            let resizeTimer;
            window.__galleryResizeHandler = () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => items.forEach(applySpan), 150);
            };
            window.addEventListener('resize', window.__galleryResizeHandler);
        }

        /* CLICK — çdo media hapet në lightbox */
        galleryGrid.addEventListener('click', (e) => {
            const itemEl = e.target.closest('.gallery-item');
            if (!itemEl) return;
            openLightbox(itemEl);
        });

        /* LIGHTBOX OPEN */
        function openLightbox(itemEl) {
            const type = itemEl.dataset.type;
            const src = itemEl.dataset.src;
            const alt = itemEl.dataset.alt;

            if (type === 'video') {
                lightboxContent.innerHTML = `
                    <video 
                        src="${src}" 
                        controls 
                        autoplay 
                        playsinline
                        class="lightbox-media"
                    ></video>
                `;
            } else {
                lightboxContent.innerHTML = `
                    <img src="${src}" alt="${alt}" class="lightbox-media">
                `;
            }

            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        /* LIGHTBOX CLOSE */
        function closeLightbox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
            // Fshi content-in që video të ndalojë menjëherë
            lightboxContent.innerHTML = '';
        }

        /* Kliko kudo në lightbox → mbyllet (përveç kontrollit të videos) */
        lightbox.addEventListener('click', (e) => {
            // Nëse klikon kontrollin e videos, mos e mbyll
            if (e.target.tagName === 'VIDEO') return;
            closeLightbox();
        });

        /* ESC → mbyllet */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('open')) {
                closeLightbox();
            }
        });

        /* FILTERS */
        document.querySelectorAll('.gallery-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.gallery-filter').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderGallery(btn.dataset.filter);
            });
        });

        /* INIT */
        renderGallery();
    </script>
</body>
</html>
